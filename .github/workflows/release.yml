name: release

# Tag a commit to publish the matching project version, for example:
#
#   git tag v0.0.0a1 && git push origin v0.0.0a1
#
# A manual run builds and validates the distributions without publishing them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8
        with:
          python-version: "3.11"

      - name: Check the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(uv version --short)
          tag=${GITHUB_REF_NAME#v}
          if [ "$version" != "$tag" ]; then
            echo "tag $tag does not match pyproject version $version"
            exit 1
          fi

      - run: uv build --out-dir dist

      - name: Check the distributions
        run: |
          mapfile -t wheels < <(ls -1 dist/*.whl)
          mapfile -t sdists < <(ls -1 dist/*.tar.gz)
          [ "${#wheels[@]}" -eq 1 ] || { echo "expected exactly 1 wheel, found ${#wheels[@]}"; exit 1; }
          [ "${#sdists[@]}" -eq 1 ] || { echo "expected exactly 1 sdist, found ${#sdists[@]}"; exit 1; }
          [[ "${wheels[0]}" == dist/zelpy-* ]] || { echo "wheel is not the zelpy distribution"; exit 1; }
          [[ "${sdists[0]}" == dist/zelpy-* ]] || { echo "sdist is not the zelpy distribution"; exit 1; }

      - name: Check the metadata renders on PyPI
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
